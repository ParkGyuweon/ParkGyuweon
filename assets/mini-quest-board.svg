  <title id="quest-title">Gyuweon Park - Mini Quest Board</title>
  <desc id="quest-desc">박규원, 데이터 엔지니어 / AX 빌더. HP: 꺼지지 않는 호기심. EXP: 데이터 흐름과 AI 제품 경험. MANA: Python, SQL, Kafka, Spark. 메인 퀘스트: 흩어진 행동 데이터를 쓸모 있는 신호로 바꾸기. 사이드 퀘스트: 사용자 행동을 로그로 설계하기, 믿을 수 있는 데이터 파이프라인 만들기, 추천 로직을 오프라인으로 검증하기, AI 결과가 이해되는 화면 설계하기.</desc>
